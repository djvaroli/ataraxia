# Security headers for the runtime frontend; included by nginx.conf.
#
# Scripts come only from this origin. Inline styles are allowed because React
# style attributes and KaTeX's formula layout use them. Images may come from
# Wikimedia (lesson illustrations; the Wikipedia API returns both hosts).
# Firebase email/password sign-in needs only identitytoolkit (sign-in) and
# securetoken (token refresh); no popup, redirect, or reCAPTCHA is used.
# Turning on reCAPTCHA protection for email/password sign-in in Firebase
# would need google.com/recaptcha in script-src and frame-src.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://upload.wikimedia.org https://thumb.wikimedia.org; font-src 'self'; connect-src 'self' https://identitytoolkit.googleapis.com https://securetoken.googleapis.com; frame-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
