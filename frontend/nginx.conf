server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # add_header in a location replaces every header inherited from here, so
    # each location that sets its own headers includes the security headers too.
    include /etc/nginx/snippets/security-headers.conf;

    location = /_health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # nginx's MIME table has no entry for web app manifests.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }
}
