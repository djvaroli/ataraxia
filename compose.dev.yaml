services:
  frontend:
    build:
      target: development
    volumes:
      - ./frontend/src:/app/src:ro
      - ./frontend/index.html:/app/index.html:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
  api:
    build:
      target: development
    volumes:
      - ./backend/src:/app/src:ro
  worker:
    build:
      target: development
    volumes:
      - ./backend/src:/app/src:ro
