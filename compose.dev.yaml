services:
  frontend:
    build:
      target: development
    volumes:
      - ./frontend/src:/app/src:ro
      - ./frontend/index.html:/app/index.html:ro
      - ./frontend/public:/app/public:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
  api:
    build:
      target: development
    user: app
    environment:
      # No sign-in; the API serves only requests addressed to localhost.
      ATARAXIA_AUTH_MODE: local
    volumes:
      - ./backend/src:/app/src:ro
  worker:
    build:
      target: worker-development
    user: app
    environment:
      ATARAXIA_AUTH_MODE: local
    volumes:
      - ./backend/src:/app/src:ro
