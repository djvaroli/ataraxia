name: ataraxia

x-service: &service
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

x-health: &health
  interval: 5s
  timeout: 4s
  retries: 3
  start_period: 10s

services:
  nginx:
    <<: *service
    image: nginx:1.30.5-alpine
    ports:
      - "127.0.0.1:${ATARAXIA_HTTP_PORT:-8080}:80"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      <<: *health
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/health/ready"]

  frontend:
    <<: *service
    build:
      context: ./frontend
      target: runtime
    healthcheck:
      <<: *health
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/_health"]

  api:
    <<: *service
    build: &backend-build
      context: ./backend
      target: runtime
    environment:
      <<: &backend-env
        ATARAXIA_DATABASE_PATH: /data/ataraxia.db
        ATARAXIA_DEFAULT_TIME_ZONE: ${ATARAXIA_DEFAULT_TIME_ZONE:-UTC}
        ATARAXIA_MAX_LESSONS_PER_DAY: ${ATARAXIA_MAX_LESSONS_PER_DAY:-8}
      # Only the development override selects local mode; never use it on the VM.
      ATARAXIA_AUTH_MODE: ${ATARAXIA_AUTH_MODE:-firebase}
      ATARAXIA_OWNER_UID: ${ATARAXIA_OWNER_UID:-}
      ATARAXIA_FIREBASE_PROJECT_ID: ${ATARAXIA_FIREBASE_PROJECT_ID:-}
      ATARAXIA_FIREBASE_API_KEY: ${ATARAXIA_FIREBASE_API_KEY:-}
      ATARAXIA_FIREBASE_AUTH_DOMAIN: ${ATARAXIA_FIREBASE_AUTH_DOMAIN:-}
      ATARAXIA_FIREBASE_APP_ID: ${ATARAXIA_FIREBASE_APP_ID:-}
    volumes: &backend-data
      - ataraxia-data:/data
    healthcheck:
      <<: *health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=3)"]

  worker:
    <<: *service
    build: *backend-build
    command: ["python", "-m", "ataraxia.worker"]
    environment:
      <<: *backend-env
      ATARAXIA_GENERATOR: ${ATARAXIA_GENERATOR:-fake}
    volumes: *backend-data
    init: true
    stop_grace_period: 10s
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      <<: *health
      test: ["CMD", "python", "-m", "ataraxia.worker.healthcheck"]

volumes:
  ataraxia-data:
